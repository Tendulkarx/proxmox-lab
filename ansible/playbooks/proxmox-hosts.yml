---
# Hardening for the Proxmox hosts themselves (docs/proxmox-review.md).
#   make hosts-check   dry run, shows what would change
#   make hosts         apply
- name: Proxmox host hardening
  hosts: proxmox
  roles:
    - pve_host
    # Proxmox Backup Server on hosts with pbs_enabled (prx2; decision 61)
    - role: pbs
      when: pbs_enabled | default(false)
