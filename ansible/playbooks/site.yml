---
# Baseline + O'Neil's shell + Docker on every Linux VM in the chosen inventory.
#   make configure ENV=lab
- name: Baseline and shell for Linux VMs
  hosts: all
  become: true
  # Role tags let one part run alone, e.g. ARGS="--tags shell"
  roles:
    - { role: vm_baseline, tags: [baseline] }
    - { role: shell, tags: [shell] }
    - { role: docker, tags: [docker] }
    - { role: firewall, tags: [firewall], when: ansible_virtualization_type != 'lxc' }
    - { role: db_backups, tags: [db_backups], when: db_backups | default(false) }
