# Production Linux VMs and containers.
# Hand-built VMs need the key first: ssh-copy-id -i ~/.ssh/id_ed25519_homelab.pub turbx@<ip>
# Template-built VMs (terraform/envs/prod/vms.auto.tfvars) have it from cloud-init: add them
# here with their IP after `make up ENV=prod`.
all:
  children:
    prod:
      hosts:
        # Main app host, template-built (terraform/envs/prod/vms.auto.tfvars); Windows until 2026-09-30
        prdsrv1:
          ansible_host: 10.69.20.113
          # Nightly backup of n8n and Paperless (roles/db_backups, homelab-apps backups/)
          db_backups: true
        prdsrv2:
          ansible_host: 10.69.20.114
          # Docker was set up by hand: never rewrite daemon.json or restart Docker
          docker_manage_daemon_json: false
          # Left from when Caddy ran here (80/443) and a DNS rule Docker's published port ignores
          firewall_remove:
            - { port: "80", proto: tcp }
            - { port: "443", proto: tcp }
            - { port: "443", proto: udp }
            - { port: "53", from: 10.69.20.0/24 }
          # Nightly dumps and the off-site copy (roles/db_backups, homelab-apps backups/)
          db_backups: true
        # Infra container on prx2 (terraform/envs/prod/containers.tf); first run: make lxc-bootstrap
        prdsrv3:
          ansible_host: 10.69.20.115
      vars:
        ansible_user: turbx
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_homelab
