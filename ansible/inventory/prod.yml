# Production Linux VMs and containers.
# Hand-built VMs need the key first: ssh-copy-id -i ~/.ssh/id_ed25519_homelab.pub turbx@<ip>
# Template-built VMs (terraform/envs/prod/vms.auto.tfvars) have it from cloud-init: add them
# here with their IP after `make up ENV=prod`.
all:
  children:
    prod:
      hosts:
        # Main app host, template-built (terraform/envs/prod/vms.auto.tfvars); Windows until 2026-09-30
        prdsrv1:
          ansible_host: 10.69.20.113
          # Nightly backup of n8n and Paperless (roles/db_backups, homelab-apps backups/)
          db_backups: true
          # Containers here reach Caddy on this host's own address (Homarr's integrations and up/down
          # checks use the public names, which point here). Docker's networks only; the LAN reaches
          # 80/443 through Docker's own published ports regardless of UFW.
          firewall_allow:
            - { port: "22", proto: tcp, comment: "SSH (key only)" }
            - { port: "80", proto: tcp, from: 172.16.0.0/12, comment: "Caddy, from containers on this host" }
            - { port: "443", proto: tcp, from: 172.16.0.0/12, comment: "Caddy, from containers on this host" }
        prdsrv2:
          ansible_host: 10.69.20.114
          # Docker was set up by hand: never rewrite daemon.json or restart Docker
          docker_manage_daemon_json: false
          # Left from when Caddy ran here (80/443) and a DNS rule Docker's published port ignores
          firewall_remove:
            - { port: "80", proto: tcp }
            - { port: "443", proto: tcp }
            - { port: "443", proto: udp }
            - { port: "53", from: 10.69.20.0/24 }
          # Who may reach the ports Docker publishes here (roles/docker_firewall); DNS stays open
          docker_firewall_ports:
            - { port: 5432, comment: Postgres, allow: &db_clients [10.69.20.113, 10.69.20.115, 10.69.10.0/24, 10.69.2.0/24] }
            - { port: 1433, comment: SQL Server, allow: *db_clients }
            - { port: 1521, comment: Oracle, allow: *db_clients }
            - { port: 8081, comment: "Pi-hole page, for Caddy on prdsrv1", allow: [10.69.20.113] }
            - { port: 7007, comment: "Dozzle agent, for Dozzle on prdsrv1", allow: [10.69.20.113] }
            - { port: 2375, comment: "read-only Docker API, for Homarr on prdsrv1", allow: [10.69.20.113] }
          # Nightly dumps and the off-site copy (roles/db_backups, homelab-apps backups/)
          db_backups: true
        # Infra container on prx2 (terraform/envs/prod/containers.tf); first run: make lxc-bootstrap
        prdsrv3:
          ansible_host: 10.69.20.115
          # Ports Docker publishes here: all only for prdsrv1 (Caddy, Dozzle, Homarr); DNS stays open
          docker_firewall_ports:
            - { port: 3001, comment: "Uptime Kuma, for Caddy on prdsrv1", allow: [10.69.20.113] }
            - { port: 8081, comment: "Pi-hole 2 web page, for Caddy on prdsrv1", allow: [10.69.20.113] }
            - { port: 8090, comment: "Beszel hub, for Caddy on prdsrv1", allow: [10.69.20.113] }
            - { port: 7007, comment: "Dozzle agent, for Dozzle on prdsrv1", allow: [10.69.20.113] }
            - { port: 2375, comment: "read-only Docker API, for Homarr on prdsrv1", allow: [10.69.20.113] }
      vars:
        ansible_user: turbx
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_homelab
