# Applies to every host in every inventory.
admin_user: turbx
timezone: Europe/London
locale: en_GB.UTF-8

# Single source of truth for O'Neil's shell config: the agentic-os dotfiles folder on the Mac.
# Ansible copies FROM here, so edit the dotfiles there, then re-run `make configure`.
dotfiles_dir: "{{ lookup('env', 'HOME') }}/development/agentic-os/03-software-development/Software-Development-Resources/dotfiles"

# Console (not SSH) password for admin_user on every VM: break-glass through the Proxmox
# web console if the SSH key is lost. Read from 1Password at run time; SSH stays key-only.
vm_console_password_ref: "op://Development/proxmox-vm-console/password"
