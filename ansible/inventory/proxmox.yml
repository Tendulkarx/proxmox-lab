# The Proxmox hosts themselves (not VMs). Used by: make hosts / make hosts-check
all:
  children:
    proxmox:
      hosts:
        prx1:
          ansible_host: 10.69.20.130
          pve_node: prx-server-1
          # The Backup Server on prx2 took over (2026-10-13, after two weeks side by side): the old
          # nightly job to `data` and its 06:00 copy to prx2 are retired
          pve_backup_vzdump: false
          pve_backup_copy_remove_from: prx2
          # Also back up nightly to the Backup Server on prx2 (storage made by scripts/pbs-connect.sh)
          pve_backup_pbs_storage: pbs
        prx2:
          ansible_host: 10.69.20.131
          pve_node: prx-server-2
          # Storage `archive`: backups kept outside every job (the last Windows prdsrv1, decision 63)
          pve_archive: true
          # Proxmox Backup Server installed on this host (decision 61)
          pbs_enabled: true
          # For prdsrv3, the infra container (decision 62)
          pve_lxc_templates: [ubuntu-24.04-standard_24.04-2_amd64.tar.zst]
      vars:
        # Warnings and errors by email through Gmail (decision 67)
        pve_alert_email: true
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_homelab
