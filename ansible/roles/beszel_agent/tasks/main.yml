---
# Beszel agent as a small service (no Docker on the Proxmox hosts). Safe to re-run.

- name: Service user (no login, no home)
  ansible.builtin.user:
    name: beszel
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags: [beszel]

- name: Release downloaded (checksum pinned)
  ansible.builtin.get_url:
    url: "https://github.com/henrygd/beszel/releases/download/v{{ beszel_agent_version }}/beszel-agent_linux_amd64.tar.gz"
    dest: "/root/beszel-agent-{{ beszel_agent_version }}.tar.gz"
    checksum: "sha256:{{ beszel_agent_sha256 }}"
    mode: "0600"
  tags: [beszel]

- name: Program directory
  ansible.builtin.file:
    path: /opt/beszel-agent
    state: directory
    mode: "0755"
  tags: [beszel]

- name: Program unpacked
  ansible.builtin.unarchive:
    src: "/root/beszel-agent-{{ beszel_agent_version }}.tar.gz"
    dest: /opt/beszel-agent
    remote_src: true
    include: [beszel-agent]
    mode: "0755"
  notify: Restart beszel-agent
  tags: [beszel]

# Token and key from 1Password, read on the laptop; written only to this root-only file
- name: Settings (root only)
  ansible.builtin.copy:
    dest: /etc/beszel-agent.env
    mode: "0600"
    content: |
      # Managed by Ansible (proxmox-lab role beszel_agent)
      HUB_URL={{ beszel_agent_hub_url }}
      TOKEN={{ lookup('ansible.builtin.pipe', 'op read ' ~ (beszel_agent_token_ref | quote)) }}
      KEY={{ lookup('ansible.builtin.pipe', 'op read ' ~ (beszel_agent_key_ref | quote)) }}
      SYSTEM_NAME={{ inventory_hostname }}
      EXTRA_FILESYSTEMS={{ beszel_agent_extra_filesystems }}
      DISABLE_SSH=true
  no_log: true
  notify: Restart beszel-agent
  tags: [beszel]

- name: Service
  ansible.builtin.copy:
    dest: /etc/systemd/system/beszel-agent.service
    mode: "0644"
    content: |
      # Managed by Ansible (proxmox-lab role beszel_agent)
      [Unit]
      Description=Beszel agent (reports to beszel.example.com)
      After=network-online.target
      Wants=network-online.target

      [Service]
      EnvironmentFile=/etc/beszel-agent.env
      ExecStart=/opt/beszel-agent/beszel-agent
      User=beszel
      Restart=on-failure
      RestartSec=5
      StateDirectory=beszel-agent
      Environment=DATA_DIR=/var/lib/beszel-agent
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      MemoryMax=128M

      [Install]
      WantedBy=multi-user.target
  notify: Restart beszel-agent
  tags: [beszel]

- name: Service running
  ansible.builtin.systemd_service:
    name: beszel-agent
    enabled: true
    state: started
    daemon_reload: true
  tags: [beszel]
