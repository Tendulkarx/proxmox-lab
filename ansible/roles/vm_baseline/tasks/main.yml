---
- name: Wait for cloud-init to finish (fresh VMs)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Base packages
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
      - unattended-upgrades
      - curl
      - wget
      - git
      - vim
      - htop
      - jq
      - tree
      - unzip
      - dnsutils
      - ca-certificates
      - locales
      # The cloud image ships linux-image-virtual, which leaves out the bochs display
      # driver: the console then stays in 80x25 VGA text mode. The generic kernel adds it
      # (1280x800 framebuffer, same as the ISO-installed prod VMs). Takes effect on reboot.
      - linux-image-generic
    state: present

# The agent needs a virtio-serial port that only exists once "QEMU Guest Agent" is enabled
# on the VM in Proxmox AND the VM has been fully stopped and started. Until then, starting
# the service fails with "a dependency job failed", so check for the port first.
- name: Is the guest agent port present?
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: vm_baseline_qga_port

- name: Guest agent running
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true
  when: vm_baseline_qga_port.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"  # needs packages a dry run doesn't install

- name: Guest agent waiting on Proxmox
  ansible.builtin.debug:
    msg: >-
      qemu-guest-agent is installed but the VM has no agent port yet. Enable
      "QEMU Guest Agent" on this VM in Proxmox, then fully stop and start it (a reboot
      from inside the guest is not enough). The agent starts by itself after that.
  when: not vm_baseline_qga_port.stat.exists

- name: Timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Locale generated
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present

- name: Default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: "LANG={{ locale }}\n"
    mode: "0644"

- name: Unattended security upgrades enabled
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: SSH hardening (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-proxmox-lab.conf
    content: |
      # Managed by Ansible (proxmox-lab)
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Passwordless sudo for {{ admin_user }} (key-only SSH is the gate)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-{{ admin_user }}
    content: |
      # Managed by Ansible (proxmox-lab)
      {{ admin_user }} ALL=(ALL) NOPASSWD:ALL
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# Break-glass login for the Proxmox web console. SSH ignores it (PasswordAuthentication no).
# The salt is derived from the hostname so the hash is stable and re-runs report no change.
- name: Console password for {{ admin_user }} (from 1Password)
  ansible.builtin.user:
    name: "{{ admin_user }}"
    password: "{{ lookup('ansible.builtin.pipe', 'op read ' ~ (vm_console_password_ref | quote)) | password_hash('sha512', (inventory_hostname | hash('sha256'))[:16]) }}"
    update_password: always
  no_log: true
  tags: [console_password]

# Login prompt on the serial port, for the Proxmox xterm.js console (copy and paste work
# there, unlike noVNC). Template VMs get it from console=ttyS0; hand-built ones need it
# enabled. It stays idle until the VM has a serial port (Terraform serial_device).
- name: Serial console login (serial-getty@ttyS0)
  ansible.builtin.systemd:
    name: serial-getty@ttyS0.service
    enabled: true
  tags: [serial_console]
