---
# Local domain for the hosts' FQDN and DNS search (was ob.local; rest of the lab uses home.arpa)
pve_domain: home.arpa

# Nightly backup job (vzdump) to the host's own `data` storage. Lab VMIDs are excluded.
pve_backup_schedule: "02:30"
pve_backup_storage: data
# Only 2 copies: these are full backups on the SAME disk as the VMs (prx1 has ~225 GB free).
# Raise once backups move to Proxmox Backup Server (deduplicated) on the other host.
pve_backup_retention: "keep-last=2"
# Second nightly job to Proxmox Backup Server, on hosts with pve_backup_pbs_storage set
# (inventory). An hour after the vzdump job, which takes minutes.
pve_backup_pbs_schedule: "03:30"
# Lab VMs 900-919, and template 9000: scripts/prep-host.sh rebuilds it, so copies only use space.
pve_backup_exclude: "{{ (range(900, 920) | list + [9000]) | join(',') }}"

# Off-host copy (B1): a host with pve_backup_copy_to set (inventory/proxmox.yml) mirrors its
# backup folder to that host each morning, after the nightly job. The target sees the copies
# as storage <host>-copy, so they can be restored from its web UI. It runs only when the last
# nightly run succeeded, so the copy always holds the last two good backups per VM.
pve_backup_copy_time: "06:00"

# Tag colours (Datacenter > Options > Tag Style)
pve_tag_style: "color-map=prod:c62828:ffffff;lab:2e7d32:ffffff;terraform:5c6bc0:ffffff;docker:1e88e5:ffffff;windows:0078d4:ffffff;linux:f57c00:000000;template:757575:ffffff,shape=circle,ordering=config"

# Alerts: set to an ntfy topic URL (e.g. https://ntfy.sh/<long-random-topic>) to enable.
# Empty = skipped.
pve_ntfy_url: ""

# Alerts by email (set pve_alert_email: true in the inventory). The same Gmail app password
# property-search and Uptime Kuma use; it sends to itself.
pve_alert_user_ref: "op://property-search-prod/app/EMAIL_USERNAME"
pve_alert_password_ref: "op://property-search-prod/app/EMAIL_PASSWORD"
# Alerts go to the plus-address <user>+<tag>@..., so one Gmail filter (to:...+homelab@...) labels
# every alert from Proxmox, the Backup Server and Uptime Kuma.
pve_alert_tag: homelab

# Literal Proxmox template placeholders (not Jinja), hence !unsafe
pve_backup_notes: !unsafe "{{guestname}}"
pve_ntfy_body: !unsafe "{{ title }}\n\n{{ message }}"

# VM start order per host (set as root; the Terraform token lacks Sys.Modify, which
# Proxmox requires for this option). Keyed by pve_node.
pve_startup:
  prx-server-1:
    101: "order=1,up=60,down=120"   # prdsrv2: DNS + reverse proxy first
    100: "order=2,down=120"         # prdsrv1
  prx-server-2: {}
