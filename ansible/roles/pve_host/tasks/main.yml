---
# Proxmox host hardening from docs/proxmox-review.md. Safe to re-run.
# Nothing here touches running VMs.

# M3: stale Proxmox 8 (bookworm) repo files --------------------------------------------
- name: Remove stale bookworm and duplicate repo files
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pve-install-repo.list
    - pve-install-repo.sources
    - pve-install-repo.list.bak
    - pve-enterprise.list
    - pve-enterprise.list.bak
  tags: [repos]

- name: No bookworm entries remain anywhere in apt sources
  ansible.builtin.shell: grep -rl bookworm /etc/apt/sources.list /etc/apt/sources.list.d/ || true
  register: pve_bookworm
  check_mode: false  # read-only probe; must run in --check too
  changed_when: false
  failed_when: pve_bookworm.stdout | length > 0
  when: not ansible_check_mode  # in a dry run the files are only "would be" removed
  tags: [repos]

# M4: half-installed packages ------------------------------------------------------------
- name: Check for half-installed packages
  ansible.builtin.command: dpkg --audit
  register: pve_dpkg_audit
  check_mode: false  # read-only probe; must run in --check too
  changed_when: false
  tags: [packages]

- name: Finish interrupted package configuration
  ansible.builtin.command: dpkg --configure -a
  when: pve_dpkg_audit.stdout | length > 0
  changed_when: true
  tags: [packages]

- name: Report any Proxmox packages not correctly installed (informational)
  ansible.builtin.shell: |
    set -o pipefail
    pveversion -v | grep 'not correctly installed' | grep -v '^libknet1:' || true
  args:
    executable: /bin/bash
  register: pve_bad_pkgs
  check_mode: false
  changed_when: false
  failed_when: pve_bad_pkgs.stdout | length > 0
  tags: [packages]

# N1: old kernels -------------------------------------------------------------------------
- name: Old kernels to remove (keeps the running kernel and the newest other one)
  ansible.builtin.shell: |
    set -o pipefail
    running="proxmox-kernel-$(uname -r)-signed"
    installed=$(dpkg-query -W -f='${Package} ${db:Status-Abbrev}\n' 'proxmox-kernel-*-pve-signed' 'pve-kernel-*-pve' 2>/dev/null \
                | awk '$2=="ii"{print $1}' | sort -V)
    fallback=$(echo "$installed" | grep -vx "$running" | tail -1)
    old=$(echo "$installed" | grep -vx -e "$running" -e "$fallback" || true)
    # series meta packages for series we no longer run
    series="proxmox-kernel-$(uname -r | cut -d. -f1-2)"
    metas=$(dpkg-query -W -f='${Package} ${db:Status-Abbrev}\n' 'proxmox-kernel-[0-9]*' 2>/dev/null \
            | awk '$2=="ii"{print $1}' | grep -E '^proxmox-kernel-[0-9]+\.[0-9]+$' | grep -vx "$series" || true)
    echo $old $metas
  args:
    executable: /bin/bash
  register: pve_old_kernels
  check_mode: false  # read-only probe; must run in --check too
  changed_when: false
  tags: [kernels]

- name: Purge old kernels
  ansible.builtin.command: "apt-get purge -y {{ pve_old_kernels.stdout }}"
  when: pve_old_kernels.stdout | trim | length > 0
  changed_when: true
  tags: [kernels]

# S1: root SSH by key only ----------------------------------------------------------------
- name: Root SSH login by key only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-proxmox-lab.conf
    content: |
      # Managed by Ansible (proxmox-lab). Drop-ins are read before sshd_config, so this wins.
      PermitRootLogin prohibit-password
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
  tags: [ssh]

# S3: FQDN and DNS search domain ------------------------------------------------------------
- name: Host FQDN is {{ pve_node }}.{{ pve_domain }}
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ ansible_host | regex_escape }}\s'
    line: "{{ ansible_host }} {{ pve_node }}.{{ pve_domain }} {{ pve_node }}"
  notify: Regenerate node certificate
  tags: [fqdn]

- name: DNS search domain
  ansible.builtin.replace:
    path: /etc/resolv.conf
    regexp: '^search .*$'
    replace: "search {{ pve_domain }}"
  tags: [fqdn]

# M1: nightly backups --------------------------------------------------------------------
- name: Does the nightly backup job exist?
  ansible.builtin.command: pvesh get /cluster/backup/nightly
  register: pve_backup_job
  check_mode: false  # read-only probe; must run in --check too
  changed_when: false
  failed_when: false
  tags: [backups]

- name: Nightly backup job (all VMs except lab 900-919)
  ansible.builtin.command: >
    pvesh {{ 'set' if pve_backup_job.rc == 0 else 'create' }} /cluster/backup{{ '/nightly' if pve_backup_job.rc == 0 else '' }}
    {{ '' if pve_backup_job.rc == 0 else '--id nightly' }}
    --schedule '{{ pve_backup_schedule }}'
    --storage {{ pve_backup_storage }}
    --all 1
    --exclude '{{ pve_backup_exclude }}'
    --mode snapshot
    --compress zstd
    --prune-backups '{{ pve_backup_retention }}'
    --notes-template '{{ pve_backup_notes }}'
    --enabled 1
  changed_when: true
  tags: [backups]

# Phase 2 D: nightly backups to Proxmox Backup Server (deduplicated). Retention is the server's
# prune job, so keep-all here. Runs alongside the vzdump job above until that one is retired.
- name: Does the PBS backup job exist?
  when: pve_backup_pbs_storage is defined
  ansible.builtin.command: pvesh get /cluster/backup/pbs-nightly
  register: pve_pbs_job
  check_mode: false  # read-only probe; must run in --check too
  changed_when: false
  failed_when: false
  tags: [backups]

- name: Nightly backup job to {{ pve_backup_pbs_storage | default('PBS') }}
  when: pve_backup_pbs_storage is defined
  ansible.builtin.command: >
    pvesh {{ 'set' if pve_pbs_job.rc == 0 else 'create' }} /cluster/backup{{ '/pbs-nightly' if pve_pbs_job.rc == 0 else '' }}
    {{ '' if pve_pbs_job.rc == 0 else '--id pbs-nightly' }}
    --schedule '{{ pve_backup_pbs_schedule }}'
    --storage {{ pve_backup_pbs_storage }}
    --node {{ pve_node }}
    --all 1
    --exclude '{{ pve_backup_exclude }}'
    --mode snapshot
    --prune-backups 'keep-all=1'
    --notes-template '{{ pve_backup_notes }}'
    --enabled 1
  changed_when: true
  tags: [backups]

# B1: copy backups to the other host ------------------------------------------------------
# The key may only run rrsync into one folder on the target, so it can't do anything else there.
- name: Backup copy to {{ pve_backup_copy_to | default('another host') }}
  when: pve_backup_copy_to is defined
  tags: [backup_copy]
  vars:
    # default only so delegate_to can be templated on hosts that skip this block
    pve_copy_host: "{{ pve_backup_copy_to | default(inventory_hostname) }}"
    pve_copy_ip: "{{ hostvars[pve_copy_host].ansible_host }}"
    pve_copy_id: "{{ inventory_hostname }}-copy"
    pve_copy_path: "/mnt/pve/data/{{ inventory_hostname }}-copy"
  block:
    - name: SSH key for the copy
      ansible.builtin.command: >
        ssh-keygen -q -t ed25519 -N '' -C 'backup-copy {{ inventory_hostname }}'
        -f /root/.ssh/id_ed25519_backup_copy
      args:
        creates: /root/.ssh/id_ed25519_backup_copy

    - name: Read the copy key
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519_backup_copy.pub
      register: pve_copy_pub
      failed_when: false  # absent in a dry run on the first pass

    - name: Folder for the copies on {{ pve_copy_host }}
      ansible.builtin.file:
        path: "{{ pve_copy_path }}/dump"
        state: directory
        mode: "0755"
      delegate_to: "{{ pve_copy_host }}"

    # authorized_keys2, not authorized_keys: that one is a link into /etc/pve (pmxcfs)
    - name: Restricted key on {{ pve_copy_host }} (rrsync into the copy folder only)
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys2
        create: true
        mode: "0600"
        regexp: 'backup-copy {{ inventory_hostname }}$'
        line: >-
          command="/usr/bin/rrsync {{ pve_copy_path }}/dump",restrict
          {{ pve_copy_pub.content | b64decode | trim }}
      delegate_to: "{{ pve_copy_host }}"
      when: pve_copy_pub.content is defined

    - name: Read {{ pve_copy_host }}'s host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: pve_copy_hostkey
      delegate_to: "{{ pve_copy_host }}"

    - name: Known host for the copy
      ansible.builtin.copy:
        dest: /root/.ssh/known_hosts_backup_copy
        mode: "0600"
        content: "{{ pve_copy_ip }} {{ (pve_copy_hostkey.content | b64decode).split()[:2] | join(' ') }}\n"

    - name: Copy script
      ansible.builtin.copy:
        dest: /usr/local/sbin/pve-backup-copy
        mode: "0755"
        content: |
          #!/bin/bash
          # Managed by Ansible (proxmox-lab): mirror this host's backups to {{ pve_copy_host }}.
          set -euo pipefail
          src=/mnt/pve/data/dump
          # A mirror deletes what the source lacks: never run against a missing or empty source
          mountpoint -q /mnt/pve/data || { echo "/mnt/pve/data not mounted; not copying"; exit 1; }
          compgen -G "$src/vzdump-*.vma.zst" >/dev/null || { echo "no backups in $src; not copying"; exit 1; }
          # Only after a successful nightly run: the copy then holds the same last two good
          # backups per VM as this host. On failure it is left alone, still holding the last good pair.
          recent=$(find "$src" -name 'vzdump-*.log' -mmin -1440)
          [ -n "$recent" ] || { echo "no backup in the last 24 hours; not copying"; exit 1; }
          if grep -l 'ERROR:' $recent; then echo "last backup logged errors (files above); not copying"; exit 1; fi
          rsync -a --delete --max-delete=30 --partial --exclude='*.tmp' --exclude='*.dat' \
            -e 'ssh -i /root/.ssh/id_ed25519_backup_copy -o UserKnownHostsFile=/root/.ssh/known_hosts_backup_copy -o BatchMode=yes' \
            "$src/" root@{{ pve_copy_ip }}:./
          echo "copied $(ls "$src"/*.vma.zst | wc -l) backups to {{ pve_copy_host }}"

    - name: Copy service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/pve-backup-copy.{{ item.ext }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - ext: service
          content: |
            # Managed by Ansible (proxmox-lab)
            [Unit]
            Description=Copy backups to {{ pve_copy_host }}
            After=network-online.target
            Wants=network-online.target
            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/pve-backup-copy
        - ext: timer
          content: |
            # Managed by Ansible (proxmox-lab)
            [Unit]
            Description=Copy backups to {{ pve_copy_host }} after the nightly job
            [Timer]
            OnCalendar=*-*-* {{ pve_backup_copy_time }}
            Persistent=true
            [Install]
            WantedBy=timers.target
      loop_control:
        label: "pve-backup-copy.{{ item.ext }}"

    - name: Copy timer enabled
      ansible.builtin.systemd:
        name: pve-backup-copy.timer
        enabled: true
        state: started
        daemon_reload: true
      ignore_errors: "{{ ansible_check_mode }}"  # units don't exist yet in a dry run

    - name: Is the copy storage defined on {{ pve_copy_host }}?
      ansible.builtin.command: "pvesm status --storage {{ pve_copy_id }}"
      register: pve_copy_storage
      check_mode: false
      changed_when: false
      failed_when: false
      delegate_to: "{{ pve_copy_host }}"

    # keep-all: the mirror decides what exists; the target must never prune these itself
    - name: Copy storage on {{ pve_copy_host }} (restore from its web UI)
      ansible.builtin.command: >
        pvesm add dir {{ pve_copy_id }} --path {{ pve_copy_path }} --content backup
        --is_mountpoint /mnt/pve/data --nodes {{ hostvars[pve_copy_host].pve_node }}
        --prune-backups keep-all=1
      when: pve_copy_storage.rc != 0
      changed_when: true
      delegate_to: "{{ pve_copy_host }}"

# Archive: backups kept outside every job (decision 63) ---------------------------------------
# A plain folder on the big disk. No backup job writes here and keep-all stops Proxmox pruning
# it, so what is put here (by hand, see docs/lab-rebuild-plan.md phase 1) stays until removed.
- name: Archive storage
  when: pve_archive | default(false)
  tags: [archive]
  block:
    - name: Archive folder
      ansible.builtin.file:
        path: /mnt/pve/data/archive/dump
        state: directory
        mode: "0755"

    - name: Is the archive storage defined?
      ansible.builtin.command: pvesm status --storage archive
      register: pve_archive_storage
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Archive storage (restore from the web UI)
      ansible.builtin.command: >
        pvesm add dir archive --path /mnt/pve/data/archive --content backup
        --is_mountpoint /mnt/pve/data --nodes {{ pve_node }}
        --prune-backups keep-all=1
      when: pve_archive_storage.rc != 0
      changed_when: true

# Container templates (LXC) on `data`, for Terraform containers (prdsrv3). Downloading needs
# root, which the Terraform token deliberately is not.
- name: Container templates
  ansible.builtin.command: "pveam download data {{ item }}"
  args:
    creates: "/mnt/pve/data/template/cache/{{ item }}"
  loop: "{{ pve_lxc_templates | default([]) }}"
  tags: [templates]

# S7: VM start order ------------------------------------------------------------------
- name: Current start order
  ansible.builtin.command: "qm config {{ item.key }}"
  loop: "{{ pve_startup[pve_node] | default({}) | dict2items }}"
  register: pve_vm_cfg
  check_mode: false
  changed_when: false
  tags: [startup]

- name: VM start order
  ansible.builtin.command: "qm set {{ item.item.key }} --startup {{ item.item.value }}"
  loop: "{{ pve_vm_cfg.results }}"
  loop_control:
    label: "{{ item.item.key }}: {{ item.item.value }}"
  when: >-
    ('startup: ' ~ item.item.value) not in item.stdout
  changed_when: true
  tags: [startup]

# Template 9000: standard VGA display (default console noVNC), serial port kept -------------
- name: Template 9000 display
  ansible.builtin.shell: |
    set -o pipefail
    qm config 9000 >/dev/null 2>&1 || exit 0
    if qm config 9000 | grep -qx 'vga: std'; then echo unchanged; else qm set 9000 --vga std >/dev/null && echo changed; fi
  args:
    executable: /bin/bash
  register: pve_tpl_vga
  changed_when: "'changed' in pve_tpl_vga.stdout"
  tags: [template]

# N3: tag colours ------------------------------------------------------------------------
- name: Tag colours
  ansible.builtin.command: pvesh set /cluster/options --tag-style '{{ pve_tag_style }}'
  changed_when: false
  tags: [tags]

# S2: alerts by email through Gmail (pve_alert_email). Warnings and errors only, so a failed
# backup or verify reaches O'Neil; successes stay quiet. The login is read from 1Password when
# the target is first made (Touch ID); to change it, delete the target and run again.
- name: Alerts by email (Gmail)
  when: pve_alert_email | default(false)
  tags: [alerts]
  vars:
    pve_alert_user: "{{ lookup('ansible.builtin.pipe', 'op read ' ~ (pve_alert_user_ref | quote)) }}"
    pve_alert_password: "{{ lookup('ansible.builtin.pipe', 'op read ' ~ (pve_alert_password_ref | quote)) }}"
    pve_alert_to: "{{ pve_alert_user.split('@')[0] }}+{{ pve_alert_tag }}@{{ pve_alert_user.split('@')[1] }}"
  block:
    - name: Does the gmail target exist?
      ansible.builtin.command: pvesh get /cluster/notifications/endpoints/smtp/gmail
      register: pve_gmail
      check_mode: false
      changed_when: false
      failed_when: false

    - name: gmail target
      ansible.builtin.command: >
        pvesh create /cluster/notifications/endpoints/smtp --name gmail
        --server smtp.gmail.com --mode starttls --port 587
        --username {{ pve_alert_user | quote }} --password {{ pve_alert_password | quote }}
        --from-address {{ pve_alert_user | quote }} --mailto {{ pve_alert_to | quote }}
        --author 'Proxmox {{ pve_node }}' --comment 'proxmox-lab: alerts'
      when: pve_gmail.rc != 0
      changed_when: true
      no_log: true

    - name: Send warnings and errors to gmail
      ansible.builtin.command: >
        pvesh create /cluster/notifications/matchers
        --name warnings-to-gmail --target gmail --match-severity warning,error
        --comment 'proxmox-lab: alerts'
      register: pve_gmail_matcher
      changed_when: pve_gmail_matcher.rc == 0
      failed_when: pve_gmail_matcher.rc != 0 and 'already exists' not in pve_gmail_matcher.stderr

# S2: alerts via ntfy (only when pve_ntfy_url is set) ------------------------------------
- name: Alerts to ntfy
  when: pve_ntfy_url | length > 0
  tags: [alerts]
  block:
    - name: Does the ntfy target exist?
      ansible.builtin.command: pvesh get /cluster/notifications/endpoints/webhook/ntfy
      register: pve_ntfy
      check_mode: false
      changed_when: false
      failed_when: false

    - name: ntfy webhook target
      ansible.builtin.command: >
        pvesh create /cluster/notifications/endpoints/webhook
        --name ntfy --method post --url '{{ pve_ntfy_url }}'
        --body '{{ pve_ntfy_body | b64encode }}'
      when: pve_ntfy.rc != 0
      changed_when: true

    - name: Send warnings and errors to ntfy
      ansible.builtin.command: >
        pvesh create /cluster/notifications/matchers
        --name warnings-to-ntfy --target ntfy --match-severity warning --match-severity error
      register: pve_matcher
      changed_when: pve_matcher.rc == 0
      failed_when: pve_matcher.rc != 0 and 'already exists' not in pve_matcher.stderr
