[defaults]
inventory = ./inventory
roles_path = ./roles
remote_user = turbx
private_key_file = ~/.ssh/id_ed25519_homelab
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False
# avoids the harmless "remote_tmp did not exist" warning on first become-as-root run
remote_tmp = /tmp/.ansible-${USER}/tmp

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

[privilege_escalation]
become_method = sudo
